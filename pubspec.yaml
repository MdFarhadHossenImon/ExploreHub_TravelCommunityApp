name: explorehub
description: ExploreHub - the travelers' social network and one-stop travel booking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  video_player: ^2.10.0
  visibility_detector: ^0.4.0+2
  video_compress: ^3.1.4
  http: ^1.6.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.3.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/demo/
    - assets/google_fonts/
    - assets/world.json
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
